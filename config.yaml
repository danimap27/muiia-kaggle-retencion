# =============================================================================
# config.yaml — Proyecto Kaggle Retención de clientes (MUIIA)
# Configuración para hercules-framework. Cada fase es un array job SLURM.
# =============================================================================

experiment_name: "kaggle-retencion"
conda_env: "kaggle-retencion"
slurm_script: "core/slurm_generic.sh"

output_dir: "./results"
tables_dir: "./memoria/tablas"

# ── Dimensiones del sweep ────────────────────────────────────────────────────

# Modelos del catálogo a evaluar en CV (baseline).
baseline_models:
  - "LDA"
  - "QDA"
  - "LogReg"
  - "LogRegL1"
  - "Ridge"
  - "SGD"
  - "GaussianNB"
  - "BernoulliNB"
  - "LinearSVC"
  - "SVC_RBF"
  - "KNN"
  - "MLP"
  - "DecisionTree"
  - "RandomForest"
  - "ExtraTrees"
  - "GradBoost"
  - "HistGB"
  - "AdaBoost"
  - "Bagging"
  - "XGBoost"
  - "LightGBM"
  - "CatBoost"

# Modelos para Optuna. n_trials elevados (cada modelo entrena en segundos).
hyperopt_models:
  - { name: "cat",    trials: 250 }
  - { name: "histgb", trials: 250 }
  - { name: "xgb",    trials: 250 }
  - { name: "lgbm",   trials: 250 }
  - { name: "rf",     trials: 150 }
  - { name: "gb",     trials: 150 }
  - { name: "mlp",    trials: 80 }
  - { name: "svc",    trials: 80 }

# Threshold tuning para todos los modelos optimizados + stacking + blend.
threshold_models: ["cat", "histgb", "xgb", "lgbm", "rf", "gb", "mlp", "svc", "logreg", "stacking", "blend"]

# Modelos finales para submissions Kaggle.
predict_models: ["cat", "histgb", "xgb", "lgbm", "gb", "rf", "stacking", "blend"]

# Modelos a incluir en el blending de probabilidades.
blend_models: ["cat", "histgb", "xgb", "lgbm", "gb", "rf", "mlp", "svc", "logreg"]

# ── Fases SLURM ──────────────────────────────────────────────────────────────
# Cada fase es un array job: una tarea por línea en el .txt correspondiente.
# Secuencia recomendada con dependencias: 1 -> 2 -> 3 -> 4 -> 5 -> 6.

phases:
  - id: "1"
    name: "eda"
    file: "cmds_1_eda.txt"
    description: "Fase 1 — Análisis exploratorio"
    kind: "eda"
    filters: { phase: "eda" }

  - id: "2"
    name: "baseline"
    file: "cmds_2_baseline.txt"
    description: "Fase 2 — CV de 18 modelos del catálogo"
    kind: "baseline"
    filters: { phase: "baseline" }

  - id: "3"
    name: "hyperopt"
    file: "cmds_3_hyperopt.txt"
    description: "Fase 3 — Optuna 8 modelos"
    kind: "hyperopt"
    filters: { phase: "hyperopt" }

  - id: "4"
    name: "threshold"
    file: "cmds_4_threshold.txt"
    description: "Fase 4 — Optimización umbral F1"
    kind: "threshold"
    filters: { phase: "threshold" }

  - id: "5"
    name: "stacking"
    file: "cmds_5_stacking.txt"
    description: "Fase 5 — Meta-modelo stacking"
    kind: "stacking"
    filters: { phase: "stacking" }

  - id: "6"
    name: "blend"
    file: "cmds_6_blend.txt"
    description: "Fase 6 — Blending probabilístico top-K"
    kind: "blend"
    filters: { phase: "blend" }

  - id: "7"
    name: "predict"
    file: "cmds_7_predict.txt"
    description: "Fase 7 — Submissions Kaggle"
    kind: "predict"
    filters: { phase: "predict" }

expected_runs: 50

# ── Lectura de resultados para el monitor ────────────────────────────────────
results:
  file_pattern: "run.csv"
  group_by: ["phase"]
  metrics: ["exit_code", "elapsed_sec"]

# ── Etiquetas LaTeX para generate_tables.py ──────────────────────────────────
labels:
  model:
    LDA: "LDA"
    LogReg: "Logistic Regression"
    GaussianNB: "Naive Bayes"
    SVC_RBF: "SVM (RBF)"
    KNN: "$k$-NN"
    MLP: "MLP"
    DecisionTree: "Decision Tree"
    RandomForest: "Random Forest"
    ExtraTrees: "Extra Trees"
    GradBoost: "Gradient Boosting"
    HistGB: "HistGradientBoosting"
    XGBoost: "XGBoost"
    LightGBM: "LightGBM"
    CatBoost: "CatBoost"
    Stacking: "Stacking"

tables:
  - name: "tab_baseline"
    caption: "Resultados de validación cruzada (5 folds) sobre el conjunto de entrenamiento."
    label: "tab:baseline"
    rows: "model"
    metrics:
      - column: "f1_mean"
        label: "F1"
        pct: false
      - column: "roc_auc_mean"
        label: "AUC"
        pct: false
      - column: "accuracy_mean"
        label: "Acc"
        pct: false
